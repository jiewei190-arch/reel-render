<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style></head>
<body><canvas id="c"></canvas><script>window.TL={total:1,p:[]};</script><script type="module">
import { Impasto, Strokes, KNIFE, DAB, hex } from './styles/impasto/engine/impasto.js';
try{
const t0=performance.now();
const E = new Impasto(document.getElementById('c'),{W:1080,H:1920,ss:2}), s = new Strokes(), c = hex('#D97757');
for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; s.push({ x: 540 + Math.cos(a) * 120, y: 960 + Math.sin(a) * 120, ang: a, len: 240, wid: 92, c, c2: hex('#f0a07a'), type: KNIFE, taper: .95, seed: k }); }
s.push({ x: 540, y: 960, len: 80, wid: 80, c: hex('#f6c0a0'), type: DAB, seed: 9 });
window.DUR=1; window.seek=()=>{E.begin(); E.drawNow(s.data(), { grey: 0, run: 0 }); E.finish();};
seek(0); console.error('boot ms '+(performance.now()-t0)); window.ready=true;
}catch(e){console.error('FAIL '+e.message); window.ready=true;}
</script></body></html>
