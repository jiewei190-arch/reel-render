<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Jost';src:url(fonts/Jost.ttf);font-weight:100 900}
@font-face{font-family:'Alfa Slab One';src:url(fonts/AlfaSlabOne-Regular.ttf)}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#f4eee2}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script type="module">
import { createRiso, W, H } from './riso.js';
await Promise.all([document.fonts.load('700 54px Jost'), document.fonts.load('60px "Alfa Slab One"')]);
const R = createRiso(document.getElementById('c')), P = R.P;
window.DUR = 4; window.seek = t => {
  R.begin();
  const k = [[0, 340, 700, 300, 1], [1, 540, 700, 300, 1], [2, 440, 560, 300, .45]];
  for (const [i, x, y, r, d] of k) { P[i].fillStyle = `rgba(0,0,0,${d})`; P[i].beginPath(); P[i].arc(x, y, r, 0, 6.3); P[i].fill(); }
  for (let j = 0; j < 8; j++) { P[0].fillStyle = `rgba(0,0,0,${(j + 1) / 8})`; P[0].fillRect(100 + j * 110, 1100, 100, 160); }
  P[1].font = '120px "Alfa Slab One"'; P[1].fillStyle = '#000'; P[1].textAlign = 'center'; P[1].fillText('RISO', 540, 1500);
  R.reg = [[0, 0], [3 + 6 * Math.sin(t * 3), -2], [-3, 3]]; R.finish();
};
window.seek(0); window.ready = true;
</script></body></html>
