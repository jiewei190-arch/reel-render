<!doctype html><meta charset="utf-8"><style>@font-face{font-family:'Caveat';src:url(fonts/Caveat.ttf)}body{margin:0;width:540px;height:960px;overflow:hidden}</style><canvas id="c"></canvas>
<script type="module">import{createUS,PAL}from'./urbansketch.js';await document.fonts.load('600 60px Caveat');const R=createUS(document.getElementById('c'));
window.seek=t=>{R.begin(t);R.wash(R.rectPts(300,600,400,300),PAL.ochre,{a:.45,seed:3});R.rect(300,600,400,300,{prog:Math.min(1,t/2)});R.text('urban sketch',540,420,{size:110,reveal:Math.min(1,t)});R.finish()};seek(2);window.ready=true;</script>
