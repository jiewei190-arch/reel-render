<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Caveat;src:url(fonts/Caveat.ttf);font-weight:400 700}html,body{margin:0;width:540px;height:960px;overflow:hidden}</style></head><body><canvas id="c"></canvas>
<script type="module">
import {createRenderer,Path} from './oneline.js';
const R=createRenderer(document.getElementById('c'));
const P=new Path();P.start(200,900).pin(0);P.cubic(200,600,540,600,540,900).cubic(540,1100,800,1100,800,900).pin(4);P.finalize();
window.seek=t=>{R.begin({cx:540,cy:960,z:1});R.ink(P,t);R.world();R.write('one line',540,500,{t,t0:1,dur:1,size:90,align:'center'});R.vignette()};
window.seek(4);window.ready=true;
</script></body></html>
